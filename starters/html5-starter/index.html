<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Production-ready HTML5 starter boilerplate template">
    <meta name="author" content="Ch. Prudhvi Raj">
    <title>HTML5 Boilerplate Starter</title>
    <style>
        /* Modern CSS Reset & Baseline */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: #1e293b; background: #ffffff; padding: 24px; }
        .wrapper { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 28px; margin-bottom: 12px; }
        p { color: #64748b; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>HTML5 Clean Starter Template</h1>
        <p>This boilerplate contains modern responsive viewport configurations, CSS reset, accessible box-sizing, and scalable typography defaults.</p>
    </div>
</body>
</html>
